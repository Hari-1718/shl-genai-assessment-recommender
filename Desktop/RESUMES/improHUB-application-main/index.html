<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImproHUB | Community Portal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #A855F7;
      --primary-dark: #7E22CE;
      --bg-dark: #050505;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: #F8FAFC;
      cursor: none; /* Hide default cursor */
    }
    
    /* Ensure interactive elements also hide the cursor */
    a, button, input, select, textarea, [role="button"] {
      cursor: none !important;
    }

    .purple-glow {
      position: absolute;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(168, 85, 247, 0) 70%);
      pointer-events: none;
      z-index: -1;
    }
    .glass-card {
      background: rgba(17, 17, 19, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-primary {
      background: linear-gradient(to right, #A855F7, #7E22CE);
      transition: all 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    @keyframes glow {
      0%, 100% { 
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.4), 0 0 20px rgba(168, 85, 247, 0.2); 
        opacity: 0.8;
      }
      50% { 
        text-shadow: 0 0 25px rgba(168, 85, 247, 0.9), 0 0 45px rgba(168, 85, 247, 0.5); 
        opacity: 1;
      }
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.5s ease forwards;
    }
    .animate-float {
      animation: float 5s ease-in-out infinite;
    }
    .animate-glow {
      animation: glow 3s ease-in-out infinite;
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 20s linear infinite;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050505;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    /* Custom Cursor Styles */
    #custom-cursor-dot {
      width: 8px;
      height: 8px;
      background-color: #A855F7;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 10000;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px #A855F7;
      transition: width 0.2s, height 0.2s, background-color 0.2s;
    }
    #custom-cursor-outline {
      width: 40px;
      height: 40px;
      border: 1.5px solid rgba(168, 85, 247, 0.4);
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease-out, height 0.3s ease-out, border-color 0.3s ease-out, background-color 0.3s ease-out;
      background-color: rgba(168, 85, 247, 0.02);
    }
    .cursor-hovering #custom-cursor-outline {
      width: 60px;
      height: 60px;
      border-color: rgba(168, 85, 247, 0.8);
      background-color: rgba(168, 85, 247, 0.1);
    }
    .cursor-hovering #custom-cursor-dot {
      width: 4px;
      height: 4px;
      background-color: #fff;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="antialiased overflow-x-hidden">
  <div id="custom-cursor-dot"></div>
  <div id="custom-cursor-outline"></div>
  <div class="purple-glow top-0 left-0"></div>
  <div class="purple-glow bottom-0 right-0"></div>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
